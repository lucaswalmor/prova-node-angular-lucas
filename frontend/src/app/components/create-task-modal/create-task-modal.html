<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="w-full max-w-md rounded-xl bg-white shadow-xl">

        <!-- Header -->
        <div class="flex flex-col items-center border-b border-gray-200 px-6 py-6">
            <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-green-100">
                <svg class="h-7 w-7 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <h2 class="text-xl font-semibold text-gray-900">
                Nova Task
            </h2>

            <p class="mt-2 text-center text-sm text-gray-500">
                Preencha os dados abaixo para criar uma nova tarefa.
            </p>
        </div>

        <!-- Body -->
        <div class="space-y-4 px-6 py-5">

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">
                    Título
                </label>

                <input type="text"
                    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" 
                    [(ngModel)]="task().title"
                />
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">
                    Descrição
                </label>

                <textarea rows="3"
                    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    [(ngModel)]="task().description"
                ></textarea>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex gap-3 border-t border-gray-200 px-6 py-4">
            <button type="button"
                class="flex-1 rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer"
                (click)="closeModal()">
                Cancelar
            </button>

            <button type="button"
                class="flex-1 rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 cursor-pointer"
                (click)="createTask()">
                Salvar
            </button>
        </div>

    </div>
</div>
