<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <h1 class="text-3xl font-bold text-center mb-6">Cadastre-se</h1>

        <div class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    E-mail
                </label>
                <input id="email" name="email" type="email" [(ngModel)]="register().email"
                    class="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite seu e-mail" required />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    Senha
                </label>
                <input id="password" name="password" type="password" [(ngModel)]="register().password"
                    class="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite sua senha" required />
            </div>

            <button type="submit"
                class="w-full rounded-md bg-blue-600 py-2.5 font-medium text-white transition hover:bg-blue-700"
                (click)="onRegister()">
                Cadastrar
            </button>
        </div>

        <p class="mt-6 text-center text-sm text-gray-600">
            Já possui uma conta?
            <a routerLink="/" class="font-medium text-blue-600 hover:underline cursor-pointer">
                Cadastre-se
            </a>
        </p>
    </div>
</div>
